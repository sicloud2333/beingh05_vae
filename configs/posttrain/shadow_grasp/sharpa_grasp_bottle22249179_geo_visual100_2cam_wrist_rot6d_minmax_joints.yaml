shadow_grasp_posttrain:
  dataset_names:
    - "sharpa_grasp_bottle22249179_geo_visual100_2cam"
  data_config_names:
    - "sharpa_grasp_2cam_wrist_rot6d_minmax_joints"
  embodiment_tags:
    - "new_embodiment"

  sampling_strategy: "step"
  video_backend: "torchvision_av"
  vit_transform_args:
    type: "beingh"
    normalize_type: "imagenet"
    use_color_jitter: true

  frame_step_size:
    - 1
  num_used_episodes_per_task:
    - -1
  num_used_episodes_per_dataset:
    - -1
  num_used_frames_per_dataset:
    - -1
  weight: 1
