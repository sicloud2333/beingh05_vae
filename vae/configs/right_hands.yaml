version: 1
semantic_frame:
  origin: index_middle_ring_little_root_centroid
  lateral: little_root_to_index_root
  longitudinal: mean_four_finger_root_to_pad_at_zero
  orthogonalization: keep_longitudinal_then_gram_schmidt_lateral
  normal: lateral_cross_longitudinal

hands:
  shadow_hand_right:
    urdf_path: assets/shadow/shadow_hand_right.urdf
    palm_link: palm
    fixed_fk_joints:
      WRJ2: 0.0
      WRJ1: 0.0
    active_joint_names:
      - FFJ4
      - FFJ3
      - FFJ2
      - FFJ1
      - MFJ4
      - MFJ3
      - MFJ2
      - MFJ1
      - RFJ4
      - RFJ3
      - RFJ2
      - RFJ1
      - LFJ5
      - LFJ4
      - LFJ3
      - LFJ2
      - LFJ1
      - THJ5
      - THJ4
      - THJ3
      - THJ2
      - THJ1
    joint_semantics:
      FFJ4: {finger: index, slot: 0}
      FFJ3: {finger: index, slot: 1}
      FFJ2: {finger: index, slot: 2}
      FFJ1: {finger: index, slot: 3}
      MFJ4: {finger: middle, slot: 0}
      MFJ3: {finger: middle, slot: 1}
      MFJ2: {finger: middle, slot: 2}
      MFJ1: {finger: middle, slot: 3}
      RFJ4: {finger: ring, slot: 0}
      RFJ3: {finger: ring, slot: 1}
      RFJ2: {finger: ring, slot: 2}
      RFJ1: {finger: ring, slot: 3}
      LFJ5: {finger: little, slot: 0}
      LFJ4: {finger: little, slot: 1}
      LFJ3: {finger: little, slot: 2}
      LFJ2: {finger: little, slot: 3}
      LFJ1: {finger: little, slot: 4}
      THJ5: {finger: thumb, slot: 0}
      THJ4: {finger: thumb, slot: 1}
      THJ3: {finger: thumb, slot: 2}
      THJ2: {finger: thumb, slot: 3}
      THJ1: {finger: thumb, slot: 4}
    fingers:
      thumb:
        alignment_link: thbase
        chain_points: [thbase, thproximal, thmiddle]
        pad: {link: thdistal, offset: [0.0, -0.00627631, 0.02635380]}
      index:
        alignment_link: ffknuckle
        chain_points: [ffknuckle, ffproximal, ffmiddle]
        pad: {link: ffdistal, offset: [0.0, -0.00523995, 0.02554744]}
      middle:
        alignment_link: mfknuckle
        chain_points: [mfknuckle, mfproximal, mfmiddle]
        pad: {link: mfdistal, offset: [0.0, -0.00523995, 0.02554744]}
      ring:
        alignment_link: rfknuckle
        chain_points: [rfknuckle, rfproximal, rfmiddle]
        pad: {link: rfdistal, offset: [0.0, -0.00523995, 0.02554744]}
      little:
        alignment_link: lfknuckle
        chain_points: [lfmetacarpal, lfknuckle, lfproximal]
        pad: {link: lfdistal, offset: [0.0, -0.00523995, 0.02554744]}

